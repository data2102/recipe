# 매 푸시마다 셋을 본다.
#   seed   — 사전·파이프라인·마이그레이션이 실제로 DB 에 올라가는가
#   web    — 앱이 타입 검사와 빌드를 통과하는가
#   native — 폰 앱이 타입 검사를 통과하고 **진짜로 묶이는가**
# 셋 다 API 키가 필요 없다. 파이프라인 검증은 LLM 자리에 가짜 응답을 넣는다.

name: check

on:
  push:
  pull_request:

jobs:
  seed:
    name: 사전 · 스키마
    runs-on: ubuntu-latest

    # 운영은 PostgreSQL 이다. SQLite 검증만으로는 BIGSERIAL·FILTER·LATERAL
    # 같은 PG 문법이 안 걸린다 (tools/verify_migration.py 머리말 참조).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CSV -> SQL 변환이 CSV 와 어긋나지 않는지, 별칭 충돌은 없는지
      - name: 사전 생성 검증
        run: python tools/build_dictionary_seed.py --check

      # schema.sql + seed_dictionary.sql 을 실제 DB(SQLite)에 올려본다.
      # 커밋된 SQL 이 CSV 보다 낡았으면 여기서 실패한다.
      - name: 스키마 + 시드 적재
        run: python tools/verify_seed.py

      # supabase/migrations/ 가 db/ 원본보다 낡았으면 실패한다.
      - name: 마이그레이션 생성 검증
        run: python tools/build_migrations.py --check

      # 마이그레이션을 진짜 PostgreSQL 에 순서대로 올려본다.
      # schema.sql 이 주석에 적어둔 핵심 쿼리 3개도 여기서 파싱시킨다.
      - name: 마이그레이션 적재 (PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python tools/verify_migration.py

      # prompts/ 와 web/lib/parse/prompts.ts 가 어긋나면 실패한다.
      # 어긋나면 정확도를 잰 파서와 제품이 쓰는 파서가 달라진다.
      - name: 프롬프트 생성 검증
        run: python tools/build_prompts.py --check

      # 수집->파싱->정규화->저장 한 바퀴. LLM 자리에 가짜 응답을 넣으므로
      # 여기도 API 키가 필요 없다.
      - name: 파이프라인 한 바퀴
        run: python tools/verify_pipeline.py

      # 순수 로직(날짜 셈·정렬 같은 것)에 DB·React·DOM 이 스며들었는지.
      # 언젠가 네이티브로 갈 수 있게 열어두는 값이 이 경계 하나다
      # (tools/verify_layers.py 머리말). lib/ 에 새 파일이 생겼는데
      # 어느 층인지 안 적었으면 여기서 막힌다.
      - name: 층 경계 확인
        run: python tools/verify_layers.py

      - name: 문법 검사
        run: python -m compileall -q tools pipeline

  web:
    name: 앱
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_ux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성
        run: npm ci

      - name: 린트
        run: npm run lint

      # next build 가 타입 검사까지 한다. 환경변수 없이도 빌드돼야 한다 —
      # 키가 없으면 화면이 "아직 DB 를 안 붙였어요" 를 띄우는 게 설계다.
      - name: 유튜브 재료 검색 검증
        run: npm run test:youtube

      - name: 빌드
        run: npm run build

      - name: UX 회귀 테스트용 DB 준비
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recipe_ux_test
        run: |
          for migration in ../supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: 주차 · 장보기 · 추천 회귀 테스트
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recipe_ux_test
        run: npm run test:ux

  native:
    name: 폰 앱
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: 의존성
        run: npm ci

      # 타입 검사는 `web/lib/` 의 순수 파일까지 같이 본다 — 앱이 그것을
      # 복사하지 않고 **그대로 읽기** 때문이다 (metro.config.js).
      # 순수 층을 고치면 앱도 여기서 같이 깨진다. 그게 목적이다.
      - name: 타입 검사
        run: npx tsc --noEmit

      # **타입만 보면 안 된다.** Metro 는 tsc 와 다른 규칙으로 파일을
      # 찾는다 (`web/node_modules` 를 안 본다). 실제로 묶어봐야
      # "타입은 되는데 번들이 안 되는" 것이 걸린다.
      - name: 번들 (안드로이드)
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_OFFLINE: "1"
        run: npx expo export --platform android --output-dir /tmp/expo-check

      # 서버 코드가 앱 번들에 섞였나. 이게 섞이면 **접속 문자열이
      # 사용자 기기에 실린다** — 층 경계가 지켜졌는지를 결과물에서 잰다.
      - name: 번들에 DB 가 안 섞였나
        run: |
          bundle=$(ls /tmp/expo-check/_expo/static/js/android/*.hbc \
                      /tmp/expo-check/_expo/static/js/android/*.js 2>/dev/null | head -1)
          test -n "$bundle" || { echo "번들을 못 찾았다"; exit 1; }
          for bad in 'postgres://' 'postgresql://' 'DATABASE_URL' 'shopping_list_recipe'; do
            if grep -qF "$bad" "$bundle"; then
              echo "번들에 '$bad' 가 들어 있다 — 서버 층이 앱으로 샜다"
              exit 1
            fi
          done
          echo "깨끗하다"
